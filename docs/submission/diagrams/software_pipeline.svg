<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Say It For Me software pipeline and implementation state</title>
  <desc id="desc">A left-to-right factory translation pipeline. All phone and model stages are planned or candidates. Explicit direction, mock orchestration, timing, and evaluation rules already exist in the Python reference repository.</desc>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#11243a}.label{font:700 17px Arial,sans-serif;fill:#11243a}.sub{font:14px Arial,sans-serif;fill:#31465c}.small{font:13px Arial,sans-serif;fill:#31465c}.box{stroke:#28435f;stroke-width:2;rx:12;ry:12}.arrow{stroke:#526d87;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#526d87"/></marker></defs>
  <rect width="1600" height="700" fill="#f7fafc"/>
  <text x="55" y="60" class="title">Say It For Me — proposed Vietnamese → Korean software pipeline</text>
  <text x="55" y="92" class="sub">Legend: blue = planned phone stage; amber = candidate / proposed AI stage; green = implemented reference foundation.</text>
  <g transform="translate(55,150)">
    <rect class="box" width="150" height="105" fill="#dbeafe"/><text x="75" y="38" text-anchor="middle" class="label">Microphone</text><text x="75" y="64" text-anchor="middle" class="small">PLANNED</text><text x="75" y="84" text-anchor="middle" class="small">phone input</text>
    <rect class="box" x="190" width="150" height="105" fill="#dbeafe"/><text x="265" y="38" text-anchor="middle" class="label">Audio Capture</text><text x="265" y="64" text-anchor="middle" class="small">PLANNED</text><text x="265" y="84" text-anchor="middle" class="small">48 kHz path</text>
    <rect class="box" x="380" width="150" height="105" fill="#dbeafe"/><text x="455" y="35" text-anchor="middle" class="label">VAD /</text><text x="455" y="56" text-anchor="middle" class="label">Endpointing</text><text x="455" y="80" text-anchor="middle" class="small">planned detector</text><text x="455" y="98" text-anchor="middle" class="small">segmenter exists</text>
    <rect class="box" x="570" width="150" height="105" fill="#fff3cd"/><text x="645" y="42" text-anchor="middle" class="label">ASR</text><text x="645" y="69" text-anchor="middle" class="small">CANDIDATE</text><text x="645" y="88" text-anchor="middle" class="small">no inference</text>
    <rect class="box" x="760" width="150" height="105" fill="#fff3cd"/><text x="835" y="35" text-anchor="middle" class="label">FactorySafe</text><text x="835" y="56" text-anchor="middle" class="label">Validation</text><text x="835" y="82" text-anchor="middle" class="small">PROPOSED</text>
    <rect class="box" x="950" width="150" height="105" fill="#fff3cd"/><text x="1025" y="42" text-anchor="middle" class="label">VI–KO NMT</text><text x="1025" y="69" text-anchor="middle" class="small">CANDIDATE</text><text x="1025" y="88" text-anchor="middle" class="small">no inference</text>
    <rect class="box" x="1140" width="150" height="105" fill="#fff3cd"/><text x="1215" y="35" text-anchor="middle" class="label">Protected-token</text><text x="1215" y="56" text-anchor="middle" class="label">Check</text><text x="1215" y="82" text-anchor="middle" class="small">PROPOSED runtime</text>
    <rect class="box" x="1330" width="150" height="105" fill="#fff3cd"/><text x="1405" y="42" text-anchor="middle" class="label">Korean TTS</text><text x="1405" y="69" text-anchor="middle" class="small">CANDIDATE</text><text x="1405" y="88" text-anchor="middle" class="small">not selected</text>
    <path class="arrow" d="M150 52H185M340 52H375M530 52H565M720 52H755M910 52H945M1100 52H1135M1290 52H1325"/>
  </g>
  <g transform="translate(555,345)">
    <rect class="box" width="480" height="115" fill="#dcfce7"/>
    <text x="240" y="35" text-anchor="middle" class="label">IMPLEMENTED REFERENCE FOUNDATION</text>
    <text x="240" y="62" text-anchor="middle" class="sub">Explicit vi-ko / ko-vi contracts · mock ordered orchestration · stage timing</text>
    <text x="240" y="87" text-anchor="middle" class="sub">manifest / checksum / lazy-load design · approved-only evaluator</text>
    <path class="arrow" d="M240 0V-78H95"/><path class="arrow" d="M240 0V-78H285"/><path class="arrow" d="M240 0V-78H475"/><path class="arrow" d="M240 0V-78H665"/><path class="arrow" d="M240 0V-78H855"/>
  </g>
  <g transform="translate(1120,540)">
    <rect class="box" width="360" height="95" fill="#dbeafe"/>
    <text x="180" y="33" text-anchor="middle" class="label">Speaker / Display</text>
    <text x="180" y="58" text-anchor="middle" class="small">PLANNED: show transcript and translation;</text>
    <text x="180" y="78" text-anchor="middle" class="small">block or warn before unsafe playback</text>
    <path class="arrow" d="M285 0V-135"/>
  </g>
</svg>
